<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raghuvir Sweets And Bakers | Admin Dashboard</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<style>
  :root{
    --brand-crimson:#a5192a;
    --brand-crimson-dark:#7d1220;
    --brand-orange:#f5871f;
    --brand-orange-light:#fff3e6;
    --bg-soft:#faf7f5;
    --ink:#2b2320;
  }
  * { box-sizing:border-box; }
  body{
    background:var(--bg-soft);
    color:var(--ink);
    font-family:'Segoe UI', Roboto, Arial, sans-serif;
    padding-bottom:2rem;
  }

  /* ---------- HEADER ---------- */
  .app-header{
    background:linear-gradient(90deg, var(--brand-crimson) 0%, var(--brand-crimson-dark) 100%);
    color:#fff;
    padding:.7rem 1rem;
    display:flex;
    align-items:center;
    gap:.6rem;
    flex-wrap:wrap;
  }
  .app-header .brand-logo{
    height:38px; width:38px; object-fit:contain; border-radius:8px; background:#fff; padding:2px;
  }
  .app-header .brand-name{ font-weight:700; font-size:1rem; line-height:1.1; }
  .header-right{
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:.5rem;
    flex-wrap:wrap;
  }
  .header-select{
    background:rgba(255,255,255,.15);
    border:1px solid rgba(255,255,255,.4);
    color:#fff;
    font-size:.8rem;
    font-weight:600;
    padding:.35rem .5rem;
    border-radius:8px;
  }
  .header-select option{ color:#2b2320; }
  .scan-page-link{
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.4);
    color:#fff;
    font-size:.8rem;
    font-weight:700;
    padding:.35rem .7rem;
    border-radius:8px;
    text-decoration:none;
  }
  .scan-page-link:hover{ background:rgba(255,255,255,.25); color:#fff; }

  /* ---------- CONTENT WRAP ---------- */
  .content-wrap{
    max-width:1100px;
    margin:0 auto;
    padding:1rem .9rem 0;
  }

  /* ---------- SUMMARY CARDS ---------- */
  .summary-row{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(190px, 1fr));
    gap:.8rem;
    margin-bottom:1rem;
  }
  .summary-card{
    background:#fff;
    border:1px solid #eee0d8;
    border-radius:14px;
    padding:1rem 1.1rem;
    box-shadow:0 2px 10px rgba(165,25,42,.06);
  }
  .summary-card .label{
    font-size:.72rem;
    font-weight:800;
    letter-spacing:.4px;
    text-transform:uppercase;
    color:#a99184;
    margin-bottom:.3rem;
  }
  .summary-card .value{
    font-size:1.55rem;
    font-weight:800;
    color:var(--brand-crimson-dark);
  }
  .summary-card .value small{
    font-size:.9rem;
    font-weight:600;
    color:#a99184;
  }
  .summary-card.total .value{ color:var(--brand-crimson); }

  /* ---------- ADD ENTRY / UPDATE RATE BUTTONS ---------- */
  .add-entry-bar{
    display:flex;
    justify-content:flex-end;
    gap:.6rem;
    margin-bottom:.8rem;
  }
  .btn-add-entry{
    background:linear-gradient(90deg, var(--brand-crimson), var(--brand-crimson-dark));
    border:none;
    color:#fff;
    font-weight:700;
    font-size:.85rem;
    padding:.55rem 1.1rem;
    border-radius:10px;
  }
  .btn-update-rate{
    background:#fff;
    border:1.5px solid var(--brand-crimson);
    color:var(--brand-crimson-dark);
    font-weight:700;
    font-size:.85rem;
    padding:.55rem 1.1rem;
    border-radius:10px;
  }
  .btn-update-rate:hover{ background:var(--brand-orange-light); }

  /* ---------- DEPARTMENT TABLE ---------- */
  .dept-card{
    background:#fff;
    border-radius:14px;
    border:1px solid #eee0d8;
    box-shadow:0 2px 10px rgba(165,25,42,.06);
    margin-bottom:1.5rem;
    overflow:hidden;
  }
  .dept-card-header{
    padding:.8rem 1rem;
    border-bottom:1px solid #f1e5dc;
    font-weight:700;
    font-size:.95rem;
  }
  .dept-table{ margin-bottom:0; width:100%; }
  .dept-table thead th{
    background:#f6ede6;
    color:var(--brand-crimson-dark);
    font-size:.72rem;
    text-transform:uppercase;
    letter-spacing:.4px;
    border:none;
    padding:.65rem 1rem;
  }
  .dept-table tbody td{
    font-size:.92rem;
    vertical-align:middle;
    padding:.6rem 1rem;
  }
  .dept-bar-track{
    background:#f3ece7;
    border-radius:999px;
    height:6px;
    width:100%;
    overflow:hidden;
    margin-top:.25rem;
  }
  .dept-bar-fill{
    background:linear-gradient(90deg, var(--brand-orange), var(--brand-crimson));
    height:100%;
    border-radius:999px;
  }
  .empty-state{
    text-align:center;
    color:#a99184;
    padding:2rem 1rem;
    font-size:.9rem;
  }
  .loading-state{
    text-align:center;
    color:#a99184;
    padding:2rem 1rem;
    font-size:.9rem;
  }

  /* ---------- ITEM-WISE TABLE + GRAND TOTAL ---------- */
  .item-card-header{
    padding:.8rem 1rem;
    border-bottom:1px solid #f1e5dc;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:.5rem;
  }
  .item-card-title{ font-weight:700; font-size:.95rem; }
  .item-actions{ display:flex; gap:.5rem; }
  .btn-item-action{
    background:#fff;
    border:1.5px solid var(--brand-crimson);
    color:var(--brand-crimson-dark);
    font-weight:700;
    font-size:.8rem;
    padding:.4rem .8rem;
    border-radius:8px;
  }
  .btn-item-action:hover{
    background:var(--brand-orange-light);
  }
  .item-table{ margin-bottom:0; width:100%; }
  .item-table thead th{
    background:#f6ede6;
    color:var(--brand-crimson-dark);
    font-size:.72rem;
    text-transform:uppercase;
    letter-spacing:.4px;
    border:none;
    padding:.6rem 1rem;
  }
  .item-table tbody td{
    font-size:.88rem;
    vertical-align:middle;
    padding:.55rem 1rem;
  }
  .item-table td.num, .item-table th.num{ text-align:right; }
  .item-table tfoot td{
    font-size:.92rem;
    font-weight:800;
    padding:.7rem 1rem;
    background:var(--brand-orange-light);
    color:var(--brand-crimson-dark);
    border-top:2px solid #f0d3b8;
  }

  /* ---------- PRINT-ONLY REPORT ----------
     Everything on the page is hidden during printing EXCEPT #printSection,
     which is built fresh from the current item-wise data right before
     printing. This guarantees the printed page is a clean report (title,
     branch/month, item table, grand total) with no header, buttons, or
     modal in it — regardless of what's open on screen at the time. */
  #printSection{ display:none; }
  @media print {
    body > *:not(#printSection){ display:none !important; }
    #printSection{ display:block !important; padding:0 !important; }
    #printSection table{ width:100%; border-collapse:collapse; }
    #printSection th, #printSection td{ border:1px solid #ccc; padding:6px 8px; font-size:12px; }
    #printSection th{ background:#f0f0f0; text-align:left; }
    #printSection td.num, #printSection th.num{ text-align:right; }
    #printSection tfoot td{ font-weight:800; background:#f6ede6; }
  }

  .modal-overlay{
    display:none;
    position:fixed; inset:0;
    background:rgba(30,15,10,.55);
    z-index:2000;
    align-items:center;
    justify-content:center;
    padding:1rem;
  }
  .modal-overlay.show{ display:flex; }
  .modal-box{
    background:#fff;
    border-radius:16px;
    width:100%;
    max-width:420px;
    padding:1.25rem 1.1rem 1.1rem;
    box-shadow:0 12px 32px rgba(0,0,0,.25);
    max-height:90vh;
    overflow-y:auto;
  }
  .modal-eyebrow{
    font-size:.7rem;
    font-weight:800;
    letter-spacing:.5px;
    text-transform:uppercase;
    color:var(--brand-orange);
    margin-bottom:.3rem;
  }
  .modal-title{
    font-size:1.1rem;
    font-weight:700;
    color:var(--ink);
    margin-bottom:1rem;
  }
  .form-label-sm{
    font-size:.78rem;
    font-weight:700;
    color:#8a7268;
    margin-bottom:.3rem;
    display:block;
  }
  .item-search-results{
    border:1px solid #e9dcd2;
    border-top:none;
    border-radius:0 0 10px 10px;
    max-height:180px;
    overflow-y:auto;
    display:none;
  }
  .item-search-results.show{ display:block; }
  .item-search-results .result-row{
    padding:.5rem .7rem;
    font-size:.85rem;
    border-bottom:1px solid #f1e5dc;
    cursor:pointer;
  }
  .item-search-results .result-row:hover{ background:var(--brand-orange-light); }
  .selected-item-box{
    background:var(--brand-orange-light);
    border:1px solid #f0d3b8;
    border-radius:10px;
    padding:.6rem .8rem;
    font-size:.85rem;
    margin-bottom:.9rem;
    display:none;
  }
  .selected-item-box.show{ display:block; }
  .modal-actions{
    display:flex;
    gap:.6rem;
    margin-top:.3rem;
  }
  .modal-actions button{
    flex:1;
    border-radius:9px;
    font-weight:700;
    font-size:.85rem;
    padding:.6rem .5rem;
    border:none;
  }
  .modal-cancel{ background:#f3ece7; color:#7d6a60; }
  .modal-save{ background:linear-gradient(90deg, var(--brand-crimson), var(--brand-crimson-dark)); color:#fff; }
  .modal-save:disabled{ opacity:.5; }
  .modal-msg{
    font-size:.8rem;
    font-weight:600;
    margin-top:.6rem;
    display:none;
  }
  .modal-msg.show{ display:block; }
  .modal-msg.ok{ color:#1fa04a; }
  .modal-msg.err{ color:#dc3545; }
</style>
</head>
<body>

<div class="config-banner" id="jsErrorBanner" style="display:none; background:#f8d7da; border-bottom:1px solid #f1aeb5; color:#58151c; padding:.6rem 1rem; font-size:.85rem; text-align:center;"></div>

<!-- ===================== HEADER ===================== -->
<div class="app-header">
  <img class="brand-logo" src="https://lh3.googleusercontent.com/d/18aiuiSN9uj-mJtOkGB1rNt4GP6yUbvuO" alt="Logo" onerror="this.style.display='none'">
  <span class="brand-name">Admin Dashboard</span>
  <div class="header-right">
    <select class="header-select" id="branchSelect">
      <option value="BR1">Branch 1</option>
      <option value="BR2">Branch 2</option>
    </select>
    <select class="header-select" id="monthSelect">
      <option value="all">All Time</option>
    </select>
    <a class="scan-page-link" href="index.html"><i class="fa-solid fa-barcode"></i> Scan Page</a>
  </div>
</div>

<div class="content-wrap">

  <!-- ===================== SUMMARY CARDS ===================== -->
  <div class="summary-row">
    <div class="summary-card total">
      <div class="label">Total Valuation</div>
      <div class="value" id="totalValuationVal">₹0</div>
    </div>
    <div class="summary-card">
      <div class="label">Total Qty Counted</div>
      <div class="value" id="totalQtyVal">0</div>
    </div>
    <div class="summary-card">
      <div class="label">Entries Logged</div>
      <div class="value" id="totalEntriesVal">0</div>
    </div>
    <div class="summary-card">
      <div class="label">Departments</div>
      <div class="value" id="totalDeptsVal">0</div>
    </div>
  </div>

  <!-- ===================== ADD ENTRY / UPDATE RATE BUTTONS ===================== -->
  <div class="add-entry-bar">
    <button type="button" class="btn-update-rate" id="openUpdateRateBtn">
      <i class="fa-solid fa-tag"></i> Update Rate
    </button>
    <button type="button" class="btn-add-entry" id="openAddEntryBtn">
      <i class="fa-solid fa-plus"></i> Add Entry
    </button>
  </div>

  <!-- ===================== DEPARTMENT-WISE TABLE ===================== -->
  <div class="dept-card">
    <div class="dept-card-header">
      <i class="fa-solid fa-layer-group"></i> Department-wise Stock &amp; Valuation
    </div>
    <div id="deptTableWrap">
      <div class="loading-state" id="deptLoadingState">Loading dashboard data...</div>
    </div>
  </div>

  <!-- ===================== ITEM-WISE TABLE (Item / Qty / Rate / Total) ===================== -->
  <div class="dept-card">
    <div class="item-card-header">
      <div class="item-card-title"><i class="fa-solid fa-list"></i> Item-wise Stock &amp; Valuation</div>
      <div class="item-actions">
        <button type="button" class="btn-item-action" id="printReportBtn"><i class="fa-solid fa-print"></i> Print</button>
        <button type="button" class="btn-item-action" id="exportPdfBtn"><i class="fa-solid fa-file-pdf"></i> Export PDF</button>
      </div>
    </div>
    <div id="itemTableWrap">
      <div class="loading-state">Loading item data...</div>
    </div>
  </div>

</div>

<!-- ===================== PRINT-ONLY REPORT (built fresh before printing) ===================== -->
<div id="printSection"></div>

<!-- ===================== ADD ENTRY MODAL ===================== -->
<div class="modal-overlay" id="addEntryOverlay">
  <div class="modal-box">
    <div class="modal-eyebrow">Admin</div>
    <div class="modal-title">Add Stock Entry</div>

    <label class="form-label-sm">Branch</label>
    <select class="form-select mb-3" id="entryBranchSelect">
      <option value="BR1">Branch 1</option>
      <option value="BR2">Branch 2</option>
    </select>

    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" id="noBarcodeCheck">
      <label class="form-check-label form-label-sm mb-0" for="noBarcodeCheck" style="display:inline;">
        This item has no barcode (add manually)
      </label>
    </div>

    <!-- Normal path: search an existing Item_Master item by name/barcode -->
    <div id="barcodeItemSection">
      <label class="form-label-sm">Search Item (name or barcode)</label>
      <input type="text" class="form-control mb-0" id="itemSearchInput" placeholder="Start typing an item name or code...">
      <div class="item-search-results" id="itemSearchResults"></div>

      <div class="selected-item-box" id="selectedItemBox"></div>
    </div>

    <!-- No-barcode path: admin types the item's details directly -->
    <div id="manualItemSection" style="display:none;">
      <label class="form-label-sm">Item Name</label>
      <input type="text" class="form-control mb-3" id="manualItemNameInput" placeholder="Enter item name">

      <label class="form-label-sm">Department</label>
      <input type="text" class="form-control mb-3" id="manualItemDeptInput" placeholder="Enter department (optional)">

      <label class="form-label-sm">Rate (per unit)</label>
      <input type="number" class="form-control mb-3" id="manualItemRateInput" min="0" step="any" placeholder="Enter sale rate">
    </div>

    <label class="form-label-sm mt-2">Quantity</label>
    <input type="number" class="form-control mb-3" id="entryQtyInput" min="0" step="any" placeholder="Enter quantity">

    <label class="form-label-sm">Remarks (optional)</label>
    <input type="text" class="form-control mb-3" id="entryRemarksInput" placeholder="Optional note">

    <div class="modal-actions">
      <button type="button" class="modal-cancel" id="addEntryCancelBtn">Cancel</button>
      <button type="button" class="modal-save" id="addEntrySaveBtn" disabled>Save Entry</button>
    </div>
    <div class="modal-msg" id="addEntryMsg"></div>
  </div>
</div>

<!-- ===================== UPDATE RATE MODAL ===================== -->
<div class="modal-overlay" id="updateRateOverlay">
  <div class="modal-box">
    <div class="modal-eyebrow">Admin</div>
    <div class="modal-title">Update Item Rate</div>

    <label class="form-label-sm">Search Item (name or barcode)</label>
    <input type="text" class="form-control mb-0" id="rateSearchInput" placeholder="Start typing an item name or code...">
    <div class="item-search-results" id="rateSearchResults"></div>

    <div class="selected-item-box" id="rateSelectedItemBox"></div>

    <label class="form-label-sm mt-2">New Rate</label>
    <input type="number" class="form-control mb-3" id="newRateInput" min="0" step="any" placeholder="Enter new sale rate">

    <div class="modal-actions">
      <button type="button" class="modal-cancel" id="updateRateCancelBtn">Cancel</button>
      <button type="button" class="modal-save" id="updateRateSaveBtn" disabled>Update Rate</button>
    </div>
    <div class="modal-msg" id="updateRateMsg"></div>
  </div>
</div>

<script>
/* ============================================================================
   ⚠️ REQUIRED CONFIG — same Apps Script Web App URL as the scan page.
============================================================================ */
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxBS7ITZkbwM6CWT4V2M_Jgsa5xHXLdON_uhRN5aNec205N-7-37rYmthq3KkbtlSy3uA/exec';

const BRANCH_LABELS = { BR1: 'Branch 1', BR2: 'Branch 2' };

/* ============================================================================
   STATE
============================================================================ */
let currentBranch = 'BR1';
let currentMonth = 'all';
let itemPickList = [];      // cached full item list for the Add Entry search
let selectedItem = null;    // the item chosen in the Add Entry modal
let selectedRateItem = null; // the item chosen in the Update Rate modal
let lastDashboardData = null; // most recently loaded getDashboardData() response, used by Print/Export PDF

/* ============================================================================
   INIT
============================================================================ */
window.addEventListener('error', function (e) {
  // Surfaces any JS error visibly instead of failing silently, so if a
  // button/handler ever stops working you'll immediately see why here
  // instead of guessing.
  const banner = document.getElementById('jsErrorBanner');
  if (banner) {
    banner.style.display = 'block';
    banner.textContent = 'Page error: ' + (e.message || 'Unknown error') +
      (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : '');
  }
});

document.addEventListener('DOMContentLoaded', function () {
  try {
    document.getElementById('branchSelect').addEventListener('change', function (e) {
      currentBranch = e.target.value;
      loadMonths().then(loadDashboard);
    });
    document.getElementById('monthSelect').addEventListener('change', function (e) {
      currentMonth = e.target.value;
      loadDashboard();
    });

    wireAddEntryModal();
    wireUpdateRateModal();
    document.getElementById('printReportBtn').addEventListener('click', printReport);
    document.getElementById('exportPdfBtn').addEventListener('click', exportPdf);
    loadMonths().then(loadDashboard);
  } catch (err) {
    const banner = document.getElementById('jsErrorBanner');
    if (banner) {
      banner.style.display = 'block';
      banner.textContent = 'Setup error: ' + err.message;
    }
  }
});

/* ============================================================================
   MONTH DROPDOWN
============================================================================ */
function loadMonths() {
  return apiGet({ action: 'getAvailableMonths', branch: currentBranch })
    .then(function (months) {
      const sel = document.getElementById('monthSelect');
      const prev = currentMonth;
      sel.innerHTML = '<option value="all">All Time</option>';
      (months || []).forEach(function (m) {
        const opt = document.createElement('option');
        opt.value = m;
        opt.textContent = formatMonthLabel(m);
        sel.appendChild(opt);
      });
      // Keep previous selection if it still exists, else default to the
      // most recent month (first in the sorted list) or 'all'.
      if (Array.from(sel.options).some(function (o) { return o.value === prev; })) {
        sel.value = prev;
        currentMonth = prev;
      } else if (months && months.length > 0) {
        sel.value = months[0];
        currentMonth = months[0];
      } else {
        sel.value = 'all';
        currentMonth = 'all';
      }
    })
    .catch(function () { /* leave dropdown as-is on error */ });
}

function formatMonthLabel(yyyyMM) {
  const parts = yyyyMM.split('-');
  if (parts.length !== 2) return yyyyMM;
  const names = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const idx = parseInt(parts[1], 10) - 1;
  return (names[idx] || parts[1]) + ' ' + parts[0];
}

/* ============================================================================
   DASHBOARD DATA
============================================================================ */
function loadDashboard() {
  document.getElementById('deptTableWrap').innerHTML =
    '<div class="loading-state">Loading dashboard data...</div>';
  document.getElementById('itemTableWrap').innerHTML =
    '<div class="loading-state">Loading item data...</div>';

  apiGet({ action: 'getDashboardData', branch: currentBranch, month: currentMonth })
    .then(function (data) {
      lastDashboardData = data;
      renderDashboard(data);
      renderItemTable(data);
    })
    .catch(function (err) {
      const msg = '<div class="empty-state">Could not load dashboard data. ' + escapeHtml(err.message || '') + '</div>';
      document.getElementById('deptTableWrap').innerHTML = msg;
      document.getElementById('itemTableWrap').innerHTML = msg;
    });
}

function renderDashboard(data) {
  const totalValuation = Number(data.totalValuation) || 0;
  const totalQty = Number(data.totalQty) || 0;
  const entryCount = Number(data.entryCount) || 0;
  const depts = data.deptBreakdown || [];

  document.getElementById('totalValuationVal').textContent = formatCurrency(totalValuation);
  document.getElementById('totalQtyVal').textContent = formatNumber(totalQty);
  document.getElementById('totalEntriesVal').textContent = formatNumber(entryCount);
  document.getElementById('totalDeptsVal').textContent = formatNumber(depts.length);

  const wrap = document.getElementById('deptTableWrap');

  if (depts.length === 0) {
    wrap.innerHTML = '<div class="empty-state">No stock entries found for this selection.</div>';
    return;
  }

  const maxValuation = Math.max.apply(null, depts.map(function (d) { return d.totalValuation; }).concat([1]));

  const rows = depts.map(function (d) {
    const pct = maxValuation > 0 ? Math.round((d.totalValuation / maxValuation) * 100) : 0;
    return (
      '<tr>' +
        '<td>' +
          '<div class="fw-semibold">' + escapeHtml(d.dept) + '</div>' +
          '<div class="dept-bar-track"><div class="dept-bar-fill" style="width:' + pct + '%"></div></div>' +
        '</td>' +
        '<td>' + formatNumber(d.totalQty) + '</td>' +
        '<td>' + formatCurrency(d.totalValuation) + '</td>' +
        '<td>' + formatNumber(d.entryCount) + '</td>' +
      '</tr>'
    );
  }).join('');

  wrap.innerHTML =
    '<div class="table-responsive">' +
      '<table class="table dept-table">' +
        '<thead><tr><th>Department</th><th>Qty</th><th>Valuation</th><th>Entries</th></tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
      '</table>' +
    '</div>';
}

/* ============================================================================
   ITEM-WISE TABLE (Item Name | Qty | Rate | Total) + Grand Total row
============================================================================ */
function renderItemTable(data) {
  const wrap = document.getElementById('itemTableWrap');
  const items = data.itemBreakdown || [];

  if (items.length === 0) {
    wrap.innerHTML = '<div class="empty-state">No items found for this selection.</div>';
    return;
  }

  const rows = items.map(function (it) {
    return (
      '<tr>' +
        '<td>' + escapeHtml(it.itemName) + '<div class="text-muted" style="font-size:.75rem;">' + escapeHtml(it.dept || '') + '</div></td>' +
        '<td class="num">' + formatNumber(it.qty) + '</td>' +
        '<td class="num">' + formatCurrency(it.rate) + '</td>' +
        '<td class="num">' + formatCurrency(it.total) + '</td>' +
      '</tr>'
    );
  }).join('');

  const grandQty = Number(data.totalQty) || 0;
  const grandTotal = Number(data.totalValuation) || 0;

  wrap.innerHTML =
    '<div class="table-responsive">' +
      '<table class="table item-table">' +
        '<thead><tr><th>Item Name</th><th class="num">Qty</th><th class="num">Rate</th><th class="num">Total</th></tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
        '<tfoot><tr>' +
          '<td>Grand Total</td>' +
          '<td class="num">' + formatNumber(grandQty) + '</td>' +
          '<td class="num">-</td>' +
          '<td class="num">' + formatCurrency(grandTotal) + '</td>' +
        '</tr></tfoot>' +
      '</table>' +
    '</div>';
}

/* ============================================================================
   PRINT REPORT
============================================================================ */
function buildReportHtml() {
  const data = lastDashboardData;
  if (!data) return '<p>No data loaded yet.</p>';

  const items = data.itemBreakdown || [];
  const branchLabel = BRANCH_LABELS[data.branch] || data.branch;
  const monthLabel = data.month === 'all' ? 'All Time' : formatMonthLabel(data.month);

  const rows = items.map(function (it) {
    return (
      '<tr>' +
        '<td>' + escapeHtml(it.itemName) + '</td>' +
        '<td>' + escapeHtml(it.dept || '') + '</td>' +
        '<td class="num">' + formatNumber(it.qty) + '</td>' +
        '<td class="num">' + formatCurrency(it.rate) + '</td>' +
        '<td class="num">' + formatCurrency(it.total) + '</td>' +
      '</tr>'
    );
  }).join('');

  return (
    '<div style="font-family:Arial, sans-serif; padding:20px;">' +
      '<h2 style="margin-bottom:2px;">Raghuvir Sweets And Bakers</h2>' +
      '<div style="color:#555; margin-bottom:14px;">Stock Valuation Report — ' + escapeHtml(branchLabel) + ' — ' + escapeHtml(monthLabel) + '</div>' +
      '<table>' +
        '<thead><tr><th>Item Name</th><th>Department</th><th class="num">Qty</th><th class="num">Rate</th><th class="num">Total</th></tr></thead>' +
        '<tbody>' + rows + '</tbody>' +
        '<tfoot><tr>' +
          '<td colspan="2">Grand Total</td>' +
          '<td class="num">' + formatNumber(data.totalQty) + '</td>' +
          '<td class="num">-</td>' +
          '<td class="num">' + formatCurrency(data.totalValuation) + '</td>' +
        '</tr></tfoot>' +
      '</table>' +
    '</div>'
  );
}

function printReport() {
  if (!lastDashboardData || (lastDashboardData.itemBreakdown || []).length === 0) {
    alert('No data to print yet — wait for the dashboard to load, or pick a month with entries.');
    return;
  }
  document.getElementById('printSection').innerHTML = buildReportHtml();
  window.print();
}

/* ============================================================================
   EXPORT TO PDF (jsPDF + autoTable)
============================================================================ */
function exportPdf() {
  const data = lastDashboardData;
  if (!data || (data.itemBreakdown || []).length === 0) {
    alert('No data to export yet — wait for the dashboard to load, or pick a month with entries.');
    return;
  }

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const branchLabel = BRANCH_LABELS[data.branch] || data.branch;
  const monthLabel = data.month === 'all' ? 'All Time' : formatMonthLabel(data.month);

  doc.setFontSize(14);
  doc.text('Raghuvir Sweets And Bakers', 14, 16);
  doc.setFontSize(10);
  doc.setTextColor(100);
  doc.text('Stock Valuation Report - ' + branchLabel + ' - ' + monthLabel, 14, 22);

  const body = (data.itemBreakdown || []).map(function (it) {
    return [
      it.itemName || '',
      it.dept || '',
      formatNumber(it.qty),
      formatCurrency(it.rate),
      formatCurrency(it.total)
    ];
  });

  doc.autoTable({
    startY: 28,
    head: [['Item Name', 'Department', 'Qty', 'Rate', 'Total']],
    body: body,
    foot: [['Grand Total', '', formatNumber(data.totalQty), '-', formatCurrency(data.totalValuation)]],
    headStyles: { fillColor: [165, 25, 42] },
    footStyles: { fillColor: [245, 235, 225], textColor: [125, 18, 32], fontStyle: 'bold' },
    styles: { fontSize: 9 },
    columnStyles: {
      2: { halign: 'right' },
      3: { halign: 'right' },
      4: { halign: 'right' }
    }
  });

  const fileName = 'Stock_Valuation_' + data.branch + '_' + (data.month === 'all' ? 'AllTime' : data.month) + '.pdf';
  doc.save(fileName);
}

/* ============================================================================
   ADD ENTRY MODAL
============================================================================ */
function wireAddEntryModal() {
  const openBtn = document.getElementById('openAddEntryBtn');
  openBtn.addEventListener('click', function (e) {
    // Defensive guards: this button must NEVER navigate anywhere — it only
    // opens the in-page Add Entry modal below.
    e.preventDefault();
    e.stopPropagation();
    openAddEntryModal();
  });
  document.getElementById('addEntryCancelBtn').addEventListener('click', closeAddEntryModal);

  document.getElementById('entryBranchSelect').addEventListener('change', function (e) {
    // Branch changed inside the modal — clear any item already picked,
    // since Stock_Logs are per-branch (Item_Master itself is shared).
  });

  const searchInput = document.getElementById('itemSearchInput');
  searchInput.addEventListener('input', function () {
    renderItemSearchResults(searchInput.value);
  });
  searchInput.addEventListener('focus', function () {
    renderItemSearchResults(searchInput.value);
  });
  document.addEventListener('click', function (e) {
    if (!e.target.closest('#itemSearchInput') && !e.target.closest('#itemSearchResults')) {
      document.getElementById('itemSearchResults').classList.remove('show');
    }
  });

  document.getElementById('entryQtyInput').addEventListener('input', updateSaveButtonState);

  document.getElementById('noBarcodeCheck').addEventListener('change', function (e) {
    const isManual = e.target.checked;
    document.getElementById('barcodeItemSection').style.display = isManual ? 'none' : 'block';
    document.getElementById('manualItemSection').style.display = isManual ? 'block' : 'none';
    // Switching modes invalidates whatever was picked/typed for the other
    // mode, so clear both sides to avoid saving stale data.
    selectedItem = null;
    document.getElementById('itemSearchInput').value = '';
    document.getElementById('selectedItemBox').classList.remove('show');
    document.getElementById('manualItemNameInput').value = '';
    document.getElementById('manualItemDeptInput').value = '';
    document.getElementById('manualItemRateInput').value = '';
    updateSaveButtonState();
  });
  document.getElementById('manualItemNameInput').addEventListener('input', updateSaveButtonState);
  document.getElementById('manualItemRateInput').addEventListener('input', updateSaveButtonState);

  document.getElementById('addEntrySaveBtn').addEventListener('click', submitAdminAddEntry);
}

function openAddEntryModal() {
  document.getElementById('entryBranchSelect').value = currentBranch;
  document.getElementById('itemSearchInput').value = '';
  document.getElementById('entryQtyInput').value = '';
  document.getElementById('entryRemarksInput').value = '';
  document.getElementById('selectedItemBox').classList.remove('show');
  document.getElementById('itemSearchResults').classList.remove('show');
  document.getElementById('noBarcodeCheck').checked = false;
  document.getElementById('barcodeItemSection').style.display = 'block';
  document.getElementById('manualItemSection').style.display = 'none';
  document.getElementById('manualItemNameInput').value = '';
  document.getElementById('manualItemDeptInput').value = '';
  document.getElementById('manualItemRateInput').value = '';
  hideModalMsg();
  selectedItem = null;
  updateSaveButtonState();

  document.getElementById('addEntryOverlay').classList.add('show');

  if (itemPickList.length === 0) {
    apiGet({ action: 'getItemList' })
      .then(function (list) { itemPickList = list || []; })
      .catch(function () { itemPickList = []; });
  }
}

function closeAddEntryModal() {
  document.getElementById('addEntryOverlay').classList.remove('show');
  selectedItem = null;
}

/* ============================================================================
   UPDATE RATE MODAL
============================================================================ */
function wireUpdateRateModal() {
  const openBtn = document.getElementById('openUpdateRateBtn');
  openBtn.addEventListener('click', function (e) {
    e.preventDefault();
    e.stopPropagation();
    openUpdateRateModal();
  });
  document.getElementById('updateRateCancelBtn').addEventListener('click', closeUpdateRateModal);

  const searchInput = document.getElementById('rateSearchInput');
  searchInput.addEventListener('input', function () {
    renderRateSearchResults(searchInput.value);
  });
  searchInput.addEventListener('focus', function () {
    renderRateSearchResults(searchInput.value);
  });
  document.addEventListener('click', function (e) {
    if (!e.target.closest('#rateSearchInput') && !e.target.closest('#rateSearchResults')) {
      document.getElementById('rateSearchResults').classList.remove('show');
    }
  });

  document.getElementById('newRateInput').addEventListener('input', updateRateSaveButtonState);
  document.getElementById('updateRateSaveBtn').addEventListener('click', submitUpdateRate);
}

function openUpdateRateModal() {
  document.getElementById('rateSearchInput').value = '';
  document.getElementById('rateSearchResults').classList.remove('show');
  document.getElementById('rateSelectedItemBox').classList.remove('show');
  document.getElementById('newRateInput').value = '';
  selectedRateItem = null;
  hideUpdateRateMsg();
  updateRateSaveButtonState();

  document.getElementById('updateRateOverlay').classList.add('show');

  if (itemPickList.length === 0) {
    apiGet({ action: 'getItemList' })
      .then(function (list) { itemPickList = list || []; })
      .catch(function () { itemPickList = []; });
  }
}

function closeUpdateRateModal() {
  document.getElementById('updateRateOverlay').classList.remove('show');
  selectedRateItem = null;
}

function renderRateSearchResults(query) {
  const resultsBox = document.getElementById('rateSearchResults');
  const q = (query || '').trim().toLowerCase();

  if (!q) { resultsBox.classList.remove('show'); return; }

  const matches = itemPickList.filter(function (it) {
    const name = String(it.printName || '').toLowerCase();
    const code = String(it.code || '').toLowerCase();
    return name.indexOf(q) !== -1 || code.indexOf(q) !== -1;
  }).slice(0, 20);

  if (matches.length === 0) {
    resultsBox.innerHTML = '<div class="result-row text-muted">No items match "' + escapeHtml(query) + '"</div>';
    resultsBox.classList.add('show');
    return;
  }

  resultsBox.innerHTML = matches.map(function (it, idx) {
    return '<div class="result-row" data-idx="' + idx + '">' +
      escapeHtml(it.printName || '(unnamed item)') +
      ' <span class="text-muted">— ' + escapeHtml(it.code || '') + ' · current rate ' + formatCurrency(it.rate || 0) + '</span>' +
      '</div>';
  }).join('');
  resultsBox.classList.add('show');

  Array.prototype.forEach.call(resultsBox.querySelectorAll('.result-row'), function (row) {
    row.addEventListener('click', function () {
      const idx = Number(row.getAttribute('data-idx'));
      if (isNaN(idx) || !matches[idx]) return;
      selectItemForRateUpdate(matches[idx]);
    });
  });
}

function selectItemForRateUpdate(item) {
  selectedRateItem = item;
  document.getElementById('rateSearchInput').value = item.printName || '';
  document.getElementById('rateSearchResults').classList.remove('show');

  const box = document.getElementById('rateSelectedItemBox');
  box.innerHTML =
    '<strong>' + escapeHtml(item.printName || '(unnamed item)') + '</strong><br>' +
    '<span class="text-muted">Barcode: ' + escapeHtml(item.code || '-') + ' · Current rate: ' + formatCurrency(item.rate || 0) + '</span>';
  box.classList.add('show');

  const rateInput = document.getElementById('newRateInput');
  if (!rateInput.value) rateInput.value = item.rate || '';

  updateRateSaveButtonState();
}

function updateRateSaveButtonState() {
  const rateVal = document.getElementById('newRateInput').value;
  const rate = Number(rateVal);
  const valid = !!selectedRateItem && rateVal !== '' && !isNaN(rate) && rate >= 0;
  document.getElementById('updateRateSaveBtn').disabled = !valid;
}

function submitUpdateRate() {
  if (!selectedRateItem) return;

  const rate = Number(document.getElementById('newRateInput').value);
  if (isNaN(rate) || rate < 0) {
    showUpdateRateMsg('Enter a valid rate.', 'err');
    return;
  }

  const saveBtn = document.getElementById('updateRateSaveBtn');
  saveBtn.disabled = true;
  saveBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';

  apiPost({
    action: 'adminUpdateItemRate',
    data: { barcodeCode: selectedRateItem.code, rate: rate }
  }).then(function (result) {
    saveBtn.innerHTML = 'Update Rate';
    if (result.success) {
      showUpdateRateMsg('Rate updated successfully.', 'ok');
      itemPickList = []; // force a fresh item list so the new rate shows next time
      setTimeout(function () {
        closeUpdateRateModal();
        loadDashboard(); // re-pull valuation with the new rate
      }, 700);
    } else {
      showUpdateRateMsg(result.message || 'Update failed.', 'err');
      saveBtn.disabled = false;
    }
  }).catch(function (err) {
    saveBtn.innerHTML = 'Update Rate';
    showUpdateRateMsg('Error: ' + err.message, 'err');
    saveBtn.disabled = false;
  });
}

function showUpdateRateMsg(text, cls) {
  const el = document.getElementById('updateRateMsg');
  el.textContent = text;
  el.className = 'modal-msg show ' + cls;
}
function hideUpdateRateMsg() {
  const el = document.getElementById('updateRateMsg');
  el.className = 'modal-msg';
  el.textContent = '';
}

function renderItemSearchResults(query) {
  const resultsBox = document.getElementById('itemSearchResults');
  const q = (query || '').trim().toLowerCase();

  if (!q) { resultsBox.classList.remove('show'); return; }

  const matches = itemPickList.filter(function (it) {
    const name = String(it.printName || '').toLowerCase();
    const code = String(it.code || '').toLowerCase();
    return name.indexOf(q) !== -1 || code.indexOf(q) !== -1;
  }).slice(0, 20);

  if (matches.length === 0) {
    resultsBox.innerHTML = '<div class="result-row text-muted">No items match "' + escapeHtml(query) + '"</div>';
    resultsBox.classList.add('show');
    return;
  }

  resultsBox.innerHTML = matches.map(function (it, idx) {
    return '<div class="result-row" data-idx="' + idx + '">' +
      escapeHtml(it.printName || '(unnamed item)') +
      ' <span class="text-muted">— ' + escapeHtml(it.code || '') + '</span>' +
      '</div>';
  }).join('');
  resultsBox.classList.add('show');

  Array.prototype.forEach.call(resultsBox.querySelectorAll('.result-row'), function (row) {
    row.addEventListener('click', function () {
      const idx = Number(row.getAttribute('data-idx'));
      if (isNaN(idx) || !matches[idx]) return;
      selectItemForEntry(matches[idx]);
    });
  });
}

function selectItemForEntry(item) {
  selectedItem = item;
  document.getElementById('itemSearchInput').value = item.printName || '';
  document.getElementById('itemSearchResults').classList.remove('show');

  const box = document.getElementById('selectedItemBox');
  box.innerHTML =
    '<strong>' + escapeHtml(item.printName || '(unnamed item)') + '</strong><br>' +
    '<span class="text-muted">Barcode: ' + escapeHtml(item.code || '-') + '</span>';
  box.classList.add('show');

  updateSaveButtonState();
}

function updateSaveButtonState() {
  const isManual = document.getElementById('noBarcodeCheck').checked;
  const qtyVal = document.getElementById('entryQtyInput').value;
  const qty = Number(qtyVal);
  const qtyValid = qtyVal !== '' && !isNaN(qty) && qty >= 0;

  let valid;
  if (isManual) {
    const name = document.getElementById('manualItemNameInput').value.trim();
    const rateVal = document.getElementById('manualItemRateInput').value;
    const rate = Number(rateVal);
    const rateValid = rateVal !== '' && !isNaN(rate) && rate >= 0;
    valid = name.length > 0 && rateValid && qtyValid;
  } else {
    valid = !!selectedItem && qtyValid;
  }

  document.getElementById('addEntrySaveBtn').disabled = !valid;
}

function submitAdminAddEntry() {
  const isManual = document.getElementById('noBarcodeCheck').checked;
  const branchId = document.getElementById('entryBranchSelect').value;
  const qty = Number(document.getElementById('entryQtyInput').value);
  const remarks = document.getElementById('entryRemarksInput').value.trim();

  if (isNaN(qty) || qty < 0) {
    showModalMsg('Enter a valid quantity.', 'err');
    return;
  }

  const saveBtn = document.getElementById('addEntrySaveBtn');

  if (isManual) {
    const itemName = document.getElementById('manualItemNameInput').value.trim();
    const dept = document.getElementById('manualItemDeptInput').value.trim();
    const rate = Number(document.getElementById('manualItemRateInput').value);

    if (!itemName) { showModalMsg('Enter an item name.', 'err'); return; }
    if (isNaN(rate) || rate < 0) { showModalMsg('Enter a valid rate.', 'err'); return; }

    saveBtn.disabled = true;
    saveBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';

    apiPost({
      action: 'adminAddManualItem',
      data: { branchId: branchId, itemName: itemName, dept: dept, rate: rate, qty: qty, remarks: remarks }
    }).then(function (result) {
      saveBtn.innerHTML = 'Save Entry';
      if (result.success) {
        showModalMsg('Item created and entry saved.', 'ok');
        itemPickList = []; // force a fresh item list next time the modal opens, so the new item shows up in search
        setTimeout(function () {
          closeAddEntryModal();
          if (branchId === currentBranch) loadMonths().then(loadDashboard);
        }, 700);
      } else {
        showModalMsg(result.message || 'Save failed.', 'err');
        saveBtn.disabled = false;
      }
    }).catch(function (err) {
      saveBtn.innerHTML = 'Save Entry';
      showModalMsg('Error: ' + err.message, 'err');
      saveBtn.disabled = false;
    });
    return;
  }

  if (!selectedItem) return;

  saveBtn.disabled = true;
  saveBtn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';

  apiPost({
    action: 'adminAddEntry',
    data: {
      branchId: branchId,
      barcodeCode: selectedItem.code,
      qty: qty,
      operatorName: 'Admin',
      remarks: remarks
    }
  }).then(function (result) {
    saveBtn.innerHTML = 'Save Entry';
    if (result.success) {
      showModalMsg('Saved successfully.', 'ok');
      setTimeout(function () {
        closeAddEntryModal();
        if (branchId === currentBranch) {
          loadMonths().then(loadDashboard);
        }
      }, 700);
    } else {
      showModalMsg(result.message || 'Save failed.', 'err');
      saveBtn.disabled = false;
    }
  }).catch(function (err) {
    saveBtn.innerHTML = 'Save Entry';
    showModalMsg('Error: ' + err.message, 'err');
    saveBtn.disabled = false;
  });
}

function showModalMsg(text, cls) {
  const el = document.getElementById('addEntryMsg');
  el.textContent = text;
  el.className = 'modal-msg show ' + cls;
}
function hideModalMsg() {
  const el = document.getElementById('addEntryMsg');
  el.className = 'modal-msg';
  el.textContent = '';
}

/* ============================================================================
   API HELPERS (same pattern as index.html)
============================================================================ */
function apiGet(params) {
  const query = new URLSearchParams(params).toString();
  return fetch(APPS_SCRIPT_URL + '?' + query, { method: 'GET' })
    .then(function (res) { return res.text(); })
    .then(function (text) {
      try { return JSON.parse(text); }
      catch (e) { throw new Error('Invalid API response — check deployment access is "Anyone".'); }
    });
}

function apiPost(bodyObj) {
  return fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(bodyObj)
  })
    .then(function (res) { return res.text(); })
    .then(function (text) {
      try { return JSON.parse(text); }
      catch (e) { throw new Error('Invalid API response — check deployment access is "Anyone".'); }
    });
}

/* ============================================================================
   UTILITIES
============================================================================ */
function formatCurrency(n) {
  const num = Number(n) || 0;
  return '₹' + num.toLocaleString('en-IN', { maximumFractionDigits: 2 });
}
function formatNumber(n) {
  const num = Number(n) || 0;
  return num.toLocaleString('en-IN', { maximumFractionDigits: 2 });
}
function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}
